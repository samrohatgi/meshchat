name: MeshChat
options:
  bundleIdPrefix: com.sameer
  deploymentTarget:
    iOS: "16.0"

targets:
  MeshChat:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: MeshChat
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "MeshChat uses your local network to discover and message nearby devices."
        NSBonjourServices:
          - _meshchat-p2p._tcp
        NSBluetoothAlwaysUsageDescription: "MeshChat uses Bluetooth to discover and message nearby devices without internet."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sameer.meshchat
        PRODUCT_NAME: MeshChat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: NO
